name: Build & Release APKs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle Wrapper execute permission
        run: chmod +x gradlew

      - name: Clear Windows-specific JDK path for Linux runner
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore consistent debug keystore (optional secret)
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "HAS_SIGNING_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APKs (all ABIs + universal)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload workflow APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: savegaze-release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json

      - name: Publish APKs to GitHub Release (when signing secret is configured)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
