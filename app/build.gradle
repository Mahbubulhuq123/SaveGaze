plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getGitVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        def tag = stdout.toString().trim()
        if (tag != null && !tag.isEmpty()) {
            return tag.replaceFirst('^[vV]', '')
        }
    } catch (Exception ignored) {}
    return "1.0"
}

def getGitVersionCode = { String verName ->
    try {
        def clean = verName.split('[-+]')[0]
        def parts = clean.split('\\.')
        int major = parts.length > 0 ? parts[0].toInteger() : 1
        int minor = parts.length > 1 ? parts[1].toInteger() : 0
        int patch = parts.length > 2 ? parts[2].toInteger() : 0
        int code = major * 10000 + minor * 100 + patch
        return code > 0 ? code : 1
    } catch (Exception ignored) {
        return 1
    }
}

def resolvedVersionName = getGitVersionName()
def resolvedVersionCode = getGitVersionCode(resolvedVersionName)

android {
    namespace 'com.savegaze'
    compileSdk 34

    defaultConfig {
        applicationId "com.savegaze"
        minSdk 28
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    androidResources {
        noCompress += 'onnx'
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "SaveGaze-${abi}.apk"
            } else {
                outputFileName = "SaveGaze.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'

    testImplementation 'junit:junit:4.13.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
