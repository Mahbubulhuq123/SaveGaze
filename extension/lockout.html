<head>

<title>Access Locked - SaveGaze</title>
<link rel="stylesheet" href="lockout.css">
</head>
<body>
  <div class="cg-lockout-page">
    <div class="cg-shield">&#128737;</div>
    <h1 class="cg-title" id="sg-title">SaveGaze Lockout</h1>

  </div>
